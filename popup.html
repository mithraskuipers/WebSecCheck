<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 500px; margin: 0; padding: 0; font-size: 12px; color: #1a1a1a; background: #fff; }
  header { padding: 10px 12px 8px; border-bottom: 1px solid #e2e2e2; }
  h1 { font-size: 14px; margin: 0 0 3px; }
  .url { word-break: break-all; color: #666; font-size: 11px; }

  .btnbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
  button { cursor: pointer; font-size: 11px; padding: 5px 9px; border: 1px solid #ccc; background: #f7f7f7; border-radius: 4px; }
  button:hover { background: #eee; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { padding: 0 12px; color: #888; font-style: italic; min-height: 14px; }

  .summary { display: flex; gap: 6px; padding: 8px 12px; }
  .summary div { flex: 1; text-align: center; border-radius: 5px; padding: 7px 2px; font-weight: bold; cursor: pointer; border: 2px solid transparent; user-select: none; }
  .summary div.active-filter { border-color: #333; }
  .sum-pass { background: #d4edda; color: #155724; }
  .sum-warn { background: #fff3cd; color: #856404; }
  .sum-fail { background: #f8d7da; color: #721c24; }
  .sum-info { background: #d1ecf1; color: #0c5460; }
  .sum-count { display: block; font-size: 17px; }
  .sum-label { display: block; font-size: 9px; font-weight: normal; }

  .toolbar { display: flex; gap: 6px; padding: 0 12px 6px; }
  .toolbar input { flex: 1; min-width: 0; font-size: 11.5px; padding: 5px 6px; border: 1px solid #ccc; border-radius: 4px; }

  .quick-filters { display: flex; gap: 5px; padding: 0 12px 6px; flex-wrap: wrap; }
  .qf-chip { border: 1px solid #ccc; background: #f7f7f7; border-radius: 12px; padding: 4px 10px; font-size: 10.5px; cursor: pointer; }
  .qf-chip:hover { background: #eee; }
  .qf-chip.active { background: #2b3a4a; color: #fff; border-color: #2b3a4a; }
  .cookie-chip { font-family: Consolas, Menlo, monospace; }
  .cookie-chip.active { background: #6a4fae; border-color: #6a4fae; }
  .chip-row-label { font-size: 9.5px; color: #888; padding: 0 12px; text-transform: uppercase; letter-spacing: 0.3px; }

  .active-filters { padding: 0 12px 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 0; }
  .chip { background: #eef2f7; border: 1px solid #d6e0ea; color: #33495e; font-size: 10.5px; padding: 2px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; }
  .chip button { border: none; background: none; padding: 0; font-size: 12px; line-height: 1; cursor: pointer; color: #33495e; }
  .clear-all { font-size: 10.5px; color: #06c; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }

  #results { padding: 4px 12px 14px; }
  .group-heading { font-size: 11.5px; font-weight: 700; color: #444; margin: 14px 0 5px; padding-bottom: 3px; border-bottom: 1px solid #e5e5e5; text-transform: uppercase; letter-spacing: 0.3px; }
  .group-heading:first-child { margin-top: 4px; }

  .item { border: 1px solid #eee; border-radius: 5px; margin-bottom: 5px; }
  .item-head { display: flex; align-items: center; padding: 5px 7px; gap: 0; }
  .badge { flex: 0 0 44px; font-weight: bold; text-align: center; border-radius: 3px; padding: 1px 4px; margin-right: 6px; font-size: 10px; }
  .pass-badge { background: #d4edda; color: #155724; }
  .warn-badge { background: #fff3cd; color: #856404; }
  .fail-badge { background: #f8d7da; color: #721c24; }
  .info-badge { background: #d1ecf1; color: #0c5460; }
  .cat-tag { display: inline-block; font-size: 9px; font-weight: normal; background: #eee; color: #555; padding: 1px 6px; border-radius: 8px; margin-right: 6px; white-space: nowrap; }
  .item-title { flex: 1; font-weight: 600; }
  .item-observed { padding: 0 7px 5px 57px; color: #444; word-break: break-word; }
  .item-body { padding: 0 7px 7px 57px; border-top: 1px dashed #eee; margin-top: 2px; }
  .finding-label { font-weight: 600; font-size: 10.5px; color: #555; margin-top: 4px; }
  .finding-text { color: #333; }
  .cookie-value { font-family: Consolas, Menlo, monospace; font-size: 10.5px; background: #fafafa; border: 1px dashed #ddd; padding: 3px 4px; border-radius: 3px; word-break: break-all; }
  .empty { color: #888; font-style: italic; padding: 4px 0; }

  .tls-note { padding: 0 12px 6px; color: #888; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <h1>WebSec Header & Cookie Auditor</h1>
    <div class="url" id="url">Loading…</div>
  </header>

  <div class="btnbar">
    <button id="refresh">Scan (headers, cookies, page, TLS/cert, recon)</button>
    <button id="export">Export JSON</button>
    <button id="scanAll">Scan All Tabs</button>
  </div>
  <div id="status"></div>

  <div class="summary" id="summary"></div>

  <div class="quick-filters" id="quickFilters">
    <button class="qf-chip" data-category="all">All</button>
    <button class="qf-chip" data-category="Security Headers">Headers</button>
    <button class="qf-chip" data-category="Cookies">Cookies</button>
    <button class="qf-chip" data-category="Page-Level Checks">Page</button>
    <button class="qf-chip" data-category="Reconnaissance">Recon</button>
    <button class="qf-chip" data-category="TLS / Certificate">TLS</button>
  </div>
  <div class="chip-row-label" id="cookieChipLabel" style="display:none;">Filter to a specific cookie</div>
  <div class="quick-filters" id="cookieNameFilters"></div>
  <div class="toolbar">
    <input id="searchFilter" type="text" placeholder="Search findings, headers, cookie names…">
  </div>
  <div class="active-filters" id="activeFiltersBar"></div>

  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
