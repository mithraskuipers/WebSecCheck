<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 460px; margin: 0; padding: 10px; font-size: 12px; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 12px; margin: 12px 0 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .url { word-break: break-all; color: #555; margin-bottom: 8px; }
  .row { display: flex; align-items: flex-start; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
  .badge { flex: 0 0 46px; font-weight: bold; text-align: center; border-radius: 3px; padding: 1px 4px; margin-right: 6px; font-size: 10px; }
  .pass { background: #d4edda; color: #155724; }
  .warn { background: #fff3cd; color: #856404; }
  .fail { background: #f8d7da; color: #721c24; }
  .info { background: #d1ecf1; color: #0c5460; }
  .name { flex: 0 0 150px; font-weight: 600; }
  .detail { flex: 1; color: #444; word-break: break-word; }
  .btnbar { display: flex; gap: 6px; margin-bottom: 8px; }
  button { cursor: pointer; font-size: 11px; padding: 4px 8px; }
  #status { color: #888; font-style: italic; margin-bottom: 6px; }
  .empty { color: #888; font-style: italic; }
</style>
</head>
<body>
  <h1>WebSec Header & Cookie Auditor</h1>
  <div class="url" id="url">Loading…</div>
  <div class="btnbar">
    <button id="refresh">Re-scan</button>
    <button id="export">Export JSON</button>
    <button id="scanAll">Scan All Tabs</button>
  </div>
  <div id="status"></div>

  <h2>Security Headers</h2>
  <div id="headers"></div>

  <h2>Cookies</h2>
  <div id="cookies"></div>

  <h2>Page-Level Checks</h2>
  <div id="page"></div>

  <h2>Reconnaissance</h2>
  <div id="recon"></div>

  <script src="popup.js"></script>
</body>
</html>
