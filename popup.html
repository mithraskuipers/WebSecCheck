<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 480px; margin: 0; padding: 10px; font-size: 12px; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 12px; margin: 14px 0 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .url { word-break: break-all; color: #555; margin-bottom: 8px; }
  .btnbar { display: flex; gap: 6px; margin-bottom: 8px; }
  button { cursor: pointer; font-size: 11px; padding: 4px 8px; }
  #status { color: #888; font-style: italic; margin-bottom: 6px; }
  .empty { color: #888; font-style: italic; }

  .summary { display: flex; gap: 6px; margin-bottom: 10px; }
  .summary div { flex: 1; text-align: center; border-radius: 4px; padding: 6px 2px; font-weight: bold; cursor: pointer; border: 2px solid transparent; }
  .summary div.active-filter { border-color: #333; }
  .sum-pass { background: #d4edda; color: #155724; }
  .sum-warn { background: #fff3cd; color: #856404; }
  .sum-fail { background: #f8d7da; color: #721c24; }
  .sum-info { background: #d1ecf1; color: #0c5460; }
  .sum-count { display: block; font-size: 16px; }
  .sum-label { display: block; font-size: 9px; font-weight: normal; }

  .cat-tag { display: inline-block; font-size: 9px; font-weight: normal; background: #eee; color: #555; padding: 1px 6px; border-radius: 8px; margin-right: 6px; white-space: nowrap; }
  .filter-bar { display: none; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .filter-bar span { font-weight: 600; }

  .item { border: 1px solid #eee; border-radius: 4px; margin-bottom: 5px; }
  .item-head { display: flex; align-items: center; padding: 4px 6px; cursor: default; }
  .badge { flex: 0 0 44px; font-weight: bold; text-align: center; border-radius: 3px; padding: 1px 4px; margin-right: 6px; font-size: 10px; }
  .pass-badge { background: #d4edda; color: #155724; }
  .warn-badge { background: #fff3cd; color: #856404; }
  .fail-badge { background: #f8d7da; color: #721c24; }
  .info-badge { background: #d1ecf1; color: #0c5460; }
  .item-title { flex: 1; font-weight: 600; }
  .item-observed { padding: 0 6px 4px 56px; color: #444; word-break: break-word; }
  .item-body { padding: 0 6px 6px 56px; border-top: 1px dashed #eee; margin-top: 2px; }
  .finding-label { font-weight: 600; font-size: 10.5px; color: #555; margin-top: 4px; }
  .finding-text { color: #333; }
  .cookie-value { font-family: Consolas, Menlo, monospace; font-size: 10.5px; background: #fafafa; border: 1px dashed #ddd; padding: 3px 4px; border-radius: 3px; word-break: break-all; }
</style>
</head>
<body>
  <h1>WebSec Header & Cookie Auditor</h1>
  <div class="url" id="url">Loading…</div>
  <div class="btnbar">
    <button id="refresh">Re-scan</button>
    <button id="export">Export JSON</button>
    <button id="scanAll">Scan All Tabs</button>
  </div>
  <div id="status"></div>

  <div class="summary" id="summary"></div>

  <div class="filter-bar" id="filterBar">
    <span id="filterTitle"></span>
    <button id="clearFilter">Clear filter</button>
  </div>
  <div id="filterResults"></div>

  <div id="sectioned">
    <h2>Security Headers</h2>
    <div id="headers"></div>

    <h2>Cookies Found</h2>
    <div id="cookieInventory"></div>

    <h2>Cookie Hijacking Risk</h2>
    <div id="cookies"></div>

    <h2>Page-Level Checks</h2>
    <div id="page"></div>

    <h2>Reconnaissance</h2>
    <div id="recon"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
